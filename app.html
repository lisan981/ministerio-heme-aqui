<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gestión de Tareas Moderna</title>
    
    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons Setup -->
    <script>
        window.lucideReact = {};
        const iconNames = [
            'Plus', 'Trash2', 'Edit3', 'Check', 'X', 'Calendar', 'Clock', 
            'AlertCircle', 'CheckCircle', 'Filter', 'Search', 'Menu', 
            'Star', 'Flag', 'User', 'Settings', 'Moon', 'Sun'
        ];

        iconNames.forEach(iconName => {
            window.lucideReact[iconName] = ({ size = 20, color = 'currentColor', className = '', ...props }) => {
                const svgData = lucide.icons[iconName].contents;
                return React.createElement('svg', {
                    xmlns: 'http://www.w3.org/2000/svg',
                    width: size,
                    height: size,
                    viewBox: '0 0 24 24',
                    fill: 'none',
                    stroke: color,
                    strokeWidth: 2,
                    strokeLinecap: 'round',
                    strokeLinejoin: 'round',
                    className: className,
                    ...props,
                    dangerouslySetInnerHTML: { __html: svgData }
                });
            };
        });
    </script>
    
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .task-card {
            transition: all 0.3s ease;
        }
        
        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            Plus, Trash2, Edit3, Check, X, Calendar, Clock, 
            AlertCircle, CheckCircle, Filter, Search, Menu, 
            Star, Flag, User, Settings, Moon, Sun 
        } = window.lucideReact;

        const TaskFlow = () => {
            const [tasks, setTasks] = useState([]);
            const [filter, setFilter] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [showAddModal, setShowAddModal] = useState(false);
            const [editingTask, setEditingTask] = useState(null);
            const [darkMode, setDarkMode] = useState(false);
            const [newTask, setNewTask] = useState({
                title: '',
                description: '',
                priority: 'medium',
                category: 'personal',
                dueDate: '',
                completed: false
            });

            // Load data from localStorage on mount
            useEffect(() => {
                const savedTasks = localStorage.getItem('taskflow-tasks');
                const savedDarkMode = localStorage.getItem('taskflow-darkmode');
                
                if (savedTasks) {
                    setTasks(JSON.parse(savedTasks));
                }
                if (savedDarkMode) {
                    setDarkMode(JSON.parse(savedDarkMode));
                }
            }, []);

            // Save to localStorage whenever tasks or darkMode changes
            useEffect(() => {
                localStorage.setItem('taskflow-tasks', JSON.stringify(tasks));
            }, [tasks]);

            useEffect(() => {
                localStorage.setItem('taskflow-darkmode', JSON.stringify(darkMode));
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const addTask = () => {
                if (newTask.title.trim()) {
                    const task = {
                        id: Date.now(),
                        ...newTask,
                        createdAt: new Date().toISOString()
                    };
                    setTasks([...tasks, task]);
                    setNewTask({
                        title: '',
                        description: '',
                        priority: 'medium',
                        category: 'personal',
                        dueDate: '',
                        completed: false
                    });
                    setShowAddModal(false);
                }
            };

            const updateTask = (id, updates) => {
                setTasks(tasks.map(task => 
                    task.id === id ? { ...task, ...updates } : task
                ));
            };

            const deleteTask = (id) => {
                setTasks(tasks.filter(task => task.id !== id));
            };

            const toggleComplete = (id) => {
                updateTask(id, { 
                    completed: !tasks.find(task => task.id === id).completed 
                });
            };

            const filteredTasks = tasks.filter(task => {
                const matchesFilter = filter === 'all' || 
                    (filter === 'completed' && task.completed) ||
                    (filter === 'pending' && !task.completed) ||
                    (filter === task.priority) ||
                    (filter === task.category);
                
                const matchesSearch = task.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    task.description.toLowerCase().includes(searchTerm.toLowerCase());
                
                return matchesFilter && matchesSearch;
            });

            const getPriorityColor = (priority) => {
                switch (priority) {
                    case 'high': return 'text-red-600 bg-red-100';
                    case 'medium': return 'text-yellow-600 bg-yellow-100';
                    case 'low': return 'text-green-600 bg-green-100';
                    default: return 'text-gray-600 bg-gray-100';
                }
            };

            const getCategoryIcon = (category) => {
                switch (category) {
                    case 'work': return <User size={16} />;
                    case 'personal': return <Star size={16} />;
                    case 'health': return <AlertCircle size={16} />;
                    case 'learning': return <Settings size={16} />;
                    default: return <Flag size={16} />;
                }
            };

            const TaskModal = ({ task, onClose, onSave }) => {
                const [formData, setFormData] = useState(task || {
                    title: '',
                    description: '',
                    priority: 'medium',
                    category: 'personal',
                    dueDate: '',
                    completed: false
                });

                const handleSave = () => {
                    if (formData.title.trim()) {
                        onSave(formData);
                        onClose();
                    }
                };

                return (
                    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                        <div className="bg-white dark:bg-gray-800 rounded-xl p-6 w-full max-w-md animate-slide-up">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-xl font-semibold dark:text-white">
                                    {task ? 'Editar Tarea' : 'Nueva Tarea'}
                                </h3>
                                <button 
                                    onClick={onClose}
                                    className="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200"
                                >
                                    <X size={24} />
                                </button>
                            </div>

                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        Título
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.title}
                                        onChange={(e) => setFormData({...formData, title: e.target.value})}
                                        className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white"
                                        placeholder="¿Qué necesitas hacer?"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        Descripción
                                    </label>
                                    <textarea
                                        value={formData.description}
                                        onChange={(e) => setFormData({...formData, description: e.target.value})}
                                        className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white"
                                        rows="3"
                                        placeholder="Detalles adicionales..."
                                    />
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                            Prioridad
                                        </label>
                                        <select
                                            value={formData.priority}
                                            onChange={(e) => setFormData({...formData, priority: e.target.value})}
                                            className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white"
                                        >
                                            <option value="low">Baja</option>
                                            <option value="medium">Media</option>
                                            <option value="high">Alta</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                            Categoría
                                        </label>
                                        <select
                                            value={formData.category}
                                            onChange={(e) => setFormData({...formData, category: e.target.value})}
                                            className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white"
                                        >
                                            <option value="personal">Personal</option>
                                            <option value="work">Trabajo</option>
                                            <option value="health">Salud</option>
                                            <option value="learning">Aprendizaje</option>
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        Fecha límite
                                    </label>
                                    <input
                                        type="date"
                                        value={formData.dueDate}
                                        onChange={(e) => setFormData({...formData, dueDate: e.target.value})}
                                        className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white"
                                    />
                                </div>
                            </div>

                            <div className="flex space-x-3 mt-6">
                                <button
                                    onClick={onClose}
                                    className="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition duration-200"
                                >
                                    Cancelar
                                </button>
                                <button
                                    onClick={handleSave}
                                    className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition duration-200"
                                >
                                    {task ? 'Actualizar' : 'Crear'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            const TaskCard = ({ task }) => {
                const isOverdue = task.dueDate && new Date(task.dueDate) < new Date() && !task.completed;

                return (
                    <div className={`task-card bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border ${isOverdue ? 'border-red-200' : 'border-gray-200 dark:border-gray-700'} animate-fade-in`}>
                        <div className="flex items-start justify-between">
                            <div className="flex items-start space-x-3 flex-1">
                                <button
                                    onClick={() => toggleComplete(task.id)}
                                    className={`mt-1 p-1 rounded-full transition duration-200 ${
                                        task.completed 
                                            ? 'bg-green-100 text-green-600 hover:bg-green-200' 
                                            : 'bg-gray-100 text-gray-400 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-500'
                                    }`}
                                >
                                    <Check size={16} />
                                </button>
                                
                                <div className="flex-1">
                                    <h3 className={`font-medium ${task.completed ? 'line-through text-gray-500' : 'text-gray-900 dark:text-white'}`}>
                                        {task.title}
                                    </h3>
                                    {task.description && (
                                        <p className={`text-sm mt-1 ${task.completed ? 'text-gray-400' : 'text-gray-600 dark:text-gray-400'}`}>
                                            {task.description}
                                        </p>
                                    )}
                                    
                                    <div className="flex items-center space-x-3 mt-3">
                                        <span className={`inline-flex items-center px-2 py-1 rounded-full text-xs font-medium ${getPriorityColor(task.priority)}`}>
                                            {task.priority === 'high' ? 'Alta' : task.priority === 'medium' ? 'Media' : 'Baja'}
                                        </span>
                                        
                                        <span className="inline-flex items-center space-x-1 text-gray-500 dark:text-gray-400">
                                            {getCategoryIcon(task.category)}
                                            <span className="text-xs capitalize">{task.category}</span>
                                        </span>
                                        
                                        {task.dueDate && (
                                            <span className={`inline-flex items-center space-x-1 text-xs ${
                                                isOverdue ? 'text-red-600' : 'text-gray-500 dark:text-gray-400'
                                            }`}>
                                                <Calendar size={12} />
                                                <span>{new Date(task.dueDate).toLocaleDateString('es-ES')}</span>
                                            </span>
                                        )}
                                    </div>
                                </div>
                            </div>
                            
                            <div className="flex items-center space-x-2">
                                <button
                                    onClick={() => setEditingTask(task)}
                                    className="p-2 text-gray-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900 rounded-lg transition duration-200"
                                >
                                    <Edit3 size={16} />
                                </button>
                                <button
                                    onClick={() => deleteTask(task.id)}
                                    className="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900 rounded-lg transition duration-200"
                                >
                                    <Trash2 size={16} />
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            const stats = {
                total: tasks.length,
                completed: tasks.filter(t => t.completed).length,
                pending: tasks.filter(t => !t.completed).length,
                overdue: tasks.filter(t => t.dueDate && new Date(t.dueDate) < new Date() && !t.completed).length
            };

            return (
                <div className={`min-h-screen transition-colors duration-300 ${darkMode ? 'dark bg-gray-900' : 'bg-gray-50'}`}>
                    {/* Header */}
                    <div className="gradient-bg text-white">
                        <div className="container mx-auto px-4 py-6">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h1 className="text-3xl font-bold">TaskFlow</h1>
                                    <p className="text-blue-100 mt-1">Gestiona tus tareas de manera inteligente</p>
                                </div>
                                
                                <div className="flex items-center space-x-4">
                                    <button
                                        onClick={() => setDarkMode(!darkMode)}
                                        className="p-2 rounded-lg bg-white bg-opacity-20 hover:bg-opacity-30 transition duration-200"
                                    >
                                        {darkMode ? <Sun size={20} /> : <Moon size={20} />}
                                    </button>
                                    <button
                                        onClick={() => setShowAddModal(true)}
                                        className="bg-white text-blue-600 px-4 py-2 rounded-lg font-medium hover:bg-blue-50 transition duration-200 flex items-center space-x-2"
                                    >
                                        <Plus size={20} />
                                        <span>Nueva Tarea</span>
                                    </button>
                                </div>
                            </div>

                            {/* Stats */}
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
                                <div className="glass-effect rounded-lg p-4">
                                    <div className="text-2xl font-bold">{stats.total}</div>
                                    <div className="text-blue-100 text-sm">Total</div>
                                </div>
                                <div className="glass-effect rounded-lg p-4">
                                    <div className="text-2xl font-bold">{stats.completed}</div>
                                    <div className="text-blue-100 text-sm">Completadas</div>
                                </div>
                                <div className="glass-effect rounded-lg p-4">
                                    <div className="text-2xl font-bold">{stats.pending}</div>
                                    <div className="text-blue-100 text-sm">Pendientes</div>
                                </div>
                                <div className="glass-effect rounded-lg p-4">
                                    <div className="text-2xl font-bold text-red-300">{stats.overdue}</div>
                                    <div className="text-blue-100 text-sm">Vencidas</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="container mx-auto px-4 py-6">
                        {/* Search and Filters */}
                        <div className="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-200 dark:border-gray-700 mb-6">
                            <div className="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4">
                                <div className="flex-1 relative">
                                    <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" size={20} />
                                    <input
                                        type="text"
                                        placeholder="Buscar tareas..."
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full pl-10 pr-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white"
                                    />
                                </div>
                                
                                <div className="flex space-x-2">
                                    {['all', 'pending', 'completed', 'high', 'medium', 'low'].map(filterType => (
                                        <button
                                            key={filterType}
                                            onClick={() => setFilter(filterType)}
                                            className={`px-4 py-2 rounded-lg text-sm font-medium transition duration-200 ${
                                                filter === filterType
                                                    ? 'bg-blue-600 text-white'
                                                    : 'bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600'
                                            }`}
                                        >
                                            {filterType === 'all' ? 'Todas' :
                                             filterType === 'pending' ? 'Pendientes' :
                                             filterType === 'completed' ? 'Completadas' :
                                             filterType === 'high' ? 'Alta' :
                                             filterType === 'medium' ? 'Media' : 'Baja'}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Tasks */}
                        <div className="space-y-4">
                            {filteredTasks.length === 0 ? (
                                <div className="text-center py-12">
                                    <div className="text-gray-400 dark:text-gray-500 mb-4">
                                        <CheckCircle size={64} className="mx-auto" />
                                    </div>
                                    <h3 className="text-xl font-medium text-gray-600 dark:text-gray-400 mb-2">
                                        {tasks.length === 0 ? '¡Comienza agregando tu primera tarea!' : 'No hay tareas que coincidan con tu búsqueda'}
                                    </h3>
                                    <p className="text-gray-500 dark:text-gray-400">
                                        {tasks.length === 0 ? 'Organiza tu día y mantén todo bajo control' : 'Intenta cambiar los filtros o el término de búsqueda'}
                                    </p>
                                </div>
                            ) : (
                                filteredTasks.map(task => (
                                    <TaskCard key={task.id} task={task} />
                                ))
                            )}
                        </div>
                    </div>

                    {/* Modals */}
                    {showAddModal && (
                        <TaskModal
                            onClose={() => setShowAddModal(false)}
                            onSave={(taskData) => {
                                const task = {
                                    id: Date.now(),
                                    ...taskData,
                                    createdAt: new Date().toISOString()
                                };
                                setTasks([...tasks, task]);
                            }}
                        />
                    )}

                    {editingTask && (
                        <TaskModal
                            task={editingTask}
                            onClose={() => setEditingTask(null)}
                            onSave={(taskData) => {
                                updateTask(editingTask.id, taskData);
                                setEditingTask(null);
                            }}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TaskFlow />);
    </script>
</body>
</html>
